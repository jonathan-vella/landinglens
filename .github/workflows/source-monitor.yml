name: Reviewed source candidates

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      publish_accepted:
        description: Publish installed accepted catalog as immutable Release assets
        type: boolean
        default: false
      validate_publication:
        description: Authored safe-link validation PR with real checks; no catalog activation
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install reviewed package
        run: python -m pip install ".[dev]"
      - name: Check explicit dispatch modes
        env:
          VALIDATE_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_publication }}
          PUBLISH_ACCEPTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_accepted }}
        run: |
          if [ "$VALIDATE_PUBLICATION" = "true" ] && [ "$PUBLISH_ACCEPTED" = "true" ]; then
            echo "::error::Validation does not publish accepted catalog assets."
            exit 2
          fi
      - name: Verify candidate tooling before polling
        run: |
          python -m ruff check . > "$RUNNER_TEMP/catalog-tests.txt"
          python -m ruff format --check . >> "$RUNNER_TEMP/catalog-tests.txt"
          python -m mypy >> "$RUNNER_TEMP/catalog-tests.txt"
          python -m unittest discover -s tests -q >> "$RUNNER_TEMP/catalog-tests.txt" 2>&1
          python -m pip check >> "$RUNNER_TEMP/catalog-tests.txt"
      - name: Detect and acquire unreviewed candidate
        env:
          VALIDATE_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_publication }}
        run: |
          args=()
          if [ "$VALIDATE_PUBLICATION" = "true" ]; then args+=(--validation-candidate); fi
          python tools/monitor_sources.py --output "$RUNNER_TEMP/source-candidate" --efficiency --test-results "$RUNNER_TEMP/catalog-tests.txt" "${args[@]}"
      - name: Publish one classified PR or record settings blocker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_catalog_update.py --directory "$RUNNER_TEMP/source-candidate" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
      - name: Publish accepted catalog assets only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_accepted }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_accepted_catalog.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Retain candidate and explicit poll status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unreviewed-source-candidate
          path: ${{ runner.temp }}/source-candidate
          retention-days: 14
          if-no-files-found: error
