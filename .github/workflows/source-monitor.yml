name: Reviewed source candidates

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reviewed package
        run: python -m pip install .
      - name: Detect and acquire unreviewed candidate
        run: python tools/monitor_sources.py --output "$RUNNER_TEMP/source-candidate"
      - name: Retain candidate and explicit poll status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unreviewed-source-candidate
          path: ${{ runner.temp }}/source-candidate
          retention-days: 14
          if-no-files-found: error
