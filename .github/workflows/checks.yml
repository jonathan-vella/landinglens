name: Advisory CLI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed development dependencies
        run: |
          python -m pip install ".[dev]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
      - name: Build exact wheel and install outside checkout
        run: |
          $wheels = Join-Path $env:RUNNER_TEMP landinglens-wheels
          python -m pip wheel --no-deps --wheel-dir $wheels .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $wheel = @(Get-ChildItem $wheels -Filter '*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one wheel' }
          $clean = Join-Path $env:RUNNER_TEMP landinglens-clean
          python -m venv $clean
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { 'Scripts' } else { 'bin' }
          $exe = if ($IsWindows) { 'python.exe' } else { 'python' }
          $cleanPython = Join-Path (Join-Path $clean $bin) $exe
          "CLEAN_PYTHON=$cleanPython" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $work = Join-Path $env:RUNNER_TEMP landinglens-outside
          New-Item -ItemType Directory -Path $work | Out-Null
          "OUTSIDE_WORK=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Set-Location $work
          & $cleanPython -m pip install $wheel[0].FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $cleanPython -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $cleanPython -c "import alz_assessor, os, sys; from pathlib import Path; p=Path(alz_assessor.__file__).resolve(); assert p.is_relative_to(Path(sys.prefix).resolve()), p; assert not p.is_relative_to(Path(os.environ['GITHUB_WORKSPACE']).resolve()), p; print('Wheel import:', p)"
      - name: Use an existing Bicep compiler only
        run: |
          $compiler = Get-Command bicep -ErrorAction SilentlyContinue
          if ($compiler) {
            "BICEP_COMPILER=$($compiler.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Check formatting, lint and types
        run: |
          python -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff format --check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m mypy
      - name: Test exact installed wheel outside checkout
        run: |
          $tests = Join-Path $env:GITHUB_WORKSPACE tests
          Set-Location $env:OUTSIDE_WORK
          & $env:CLEAN_PYTHON -m unittest discover -s $tests -q
      - name: Record actual existing-compiler integration coverage
        if: always()
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE tools/check_existing_compiler.py
          $tests = Join-Path $env:GITHUB_WORKSPACE tests
          $output = Join-Path $env:RUNNER_TEMP compiler-coverage.json
          Set-Location $env:OUTSIDE_WORK
          & $env:CLEAN_PYTHON $script --tests $tests --output $output
      - name: Retain compiler coverage including unavailable reasons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-coverage-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/compiler-coverage.json
          if-no-files-found: error
      - name: Demonstrate advisory findings without Azure access
        run: |
          $fixture = (Resolve-Path tests\fixtures\slice).Path
          $alz = (Resolve-Path tests\fixtures\alz).Path
          $snapshots = Join-Path $fixture snapshots.json
          $output = Join-Path $env:RUNNER_TEMP landinglens-advisory.json
          Set-Location $env:OUTSIDE_WORK
          & $env:CLEAN_PYTHON -m alz_assessor.cli assess $fixture --input terraform --snapshots $snapshots --authorize-root $alz --provider-version 4.50.0 --var secure=false --output $output
