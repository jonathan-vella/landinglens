name: Advisory CLI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel and reviewed development dependencies
        run: |
          python -m pip install ".[dev]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
      - name: Use an existing Bicep compiler only
        run: |
          $compiler = Get-Command bicep -ErrorAction SilentlyContinue
          if ($compiler) {
            "BICEP_COMPILER=$($compiler.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Check formatting, lint and types
        run: |
          python -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff format --check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m mypy
      - name: Test offline adapters, contracts and installed workflows
        run: python -m unittest discover -s tests -q
      - name: Demonstrate advisory findings without Azure access
        run: |
          $fixture = (Resolve-Path tests\fixtures\slice).Path
          $alz = (Resolve-Path tests\fixtures\alz).Path
          $snapshots = Join-Path $fixture snapshots.json
          $output = Join-Path $env:RUNNER_TEMP landinglens-advisory.json
          alz-assessor assess $fixture --input terraform --snapshots $snapshots --authorize-root $alz --provider-version 4.50.0 --var secure=false --output $output
