[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "landinglens"
version = "0.1.0"
description = "Offline-first, advisory Azure Landing Zones assessment CLI"
requires-python = ">=3.12,<3.14"
dependencies = ["python-hcl2==8.1.4", "lark==1.3.1", "regex==2026.9.29"]

[project.optional-dependencies]
dev = [
  "ruff==0.17.3",
  "mypy==1.18.2",
  "mypy-extensions==1.1.0",
  "typing-extensions==4.16.0",
  "pathspec==0.12.1",
]

[project.scripts]
alz-assessor = "alz_assessor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alz_assessor = ["data/*.json", "data/*.LICENSE"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["hcl2.*"]
ignore_missing_imports = true
