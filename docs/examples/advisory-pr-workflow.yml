name: LandingLens advisory report example
on:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      # Supply a reviewed local evidence file. Do not collect Azure or generate a plan here.
      - run: |
          python -m alz_assessor.cli assess evidence.json --input evidence --evidence-tiers --output assessment.json
          python -m alz_assessor.cli render assessment.json --format sarif --minimize --output landinglens.sarif
          python -m alz_assessor.cli render assessment.json --format pr-summary --minimize >> "$GITHUB_STEP_SUMMARY"
      # Optional code-scanning upload requires repository support and an eligible token.
      - name: Optional code-scanning upload
        if: ${{ vars.LANDINGLENS_UPLOAD_SARIF == 'true' && github.event.pull_request.head.repo.fork == false }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: landinglens.sarif
          category: landinglens-advisory
      # The example does not set the variable or change repository settings.
      # Findings return 0. Only invalid input/software failures fail this job.
